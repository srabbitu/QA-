<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&family=Nunito:wght@800;900&display=block">
<style>
:root{--coral:#ef6a55;--coral2:#f59a7e;--cream:#fffaf0;--paper:#fbf3e4;--ink:#4a3428;--navy:#2b3a6b;--sun:#ffd166;--leaf:#7cc46a;--sky:#8ecae6;--sea:#3fa7e0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
body{font-family:Huninn,"Noto Sans TC",sans-serif;color:var(--ink)}
.sc{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.abs{position:absolute}
/* paper bg with dots */
.paperbg{position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,#fff7e6 0,transparent 55%),radial-gradient(circle at 85% 90%,#ffe9cf 0,transparent 50%),var(--paper)}
.paperbg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(#e9d6b8 3px,transparent 3.5px);background-size:44px 44px;opacity:.55}
/* title pill */
.pill{position:absolute;left:50%;padding:26px 54px 30px;border-radius:999px;background:var(--cream);box-shadow:0 10px 0 rgba(120,80,40,.18),0 20px 50px rgba(60,40,20,.25);font-size:76px;line-height:1.15;white-space:nowrap;text-align:center;transform-origin:50% 50%}
.pill b{color:var(--coral);font-weight:normal}
.tag{display:inline-block;background:var(--coral);color:#fff;border-radius:999px;padding:8px 26px 10px;font-size:40px;box-shadow:0 6px 0 rgba(150,60,40,.25)}
/* big title (no pill) */
.big{position:absolute;left:0;right:0;text-align:center;font-size:120px;line-height:1.1;color:var(--ink);text-shadow:0 6px 0 #fff,0 10px 30px rgba(255,255,255,.8)}
/* iris */
#iris{position:absolute;inset:0;pointer-events:none;z-index:50}
/* cards */
.card{position:absolute;left:50%;top:50%;width:560px;height:700px;margin:-350px 0 0 -280px;background:#fff;border-radius:44px;padding:22px 22px 0;box-shadow:0 14px 0 rgba(120,80,40,.15),0 30px 60px rgba(60,40,20,.28)}
.card .ph{width:100%;height:560px;border-radius:30px;background-size:cover;background-position:50% 50%}
.card .nm{height:118px;display:flex;align-items:center;justify-content:center;gap:16px;font-size:58px}
.card .nm i{font-style:normal;font-size:52px}
/* counter */
#cnt{position:absolute;left:0;right:0;top:160px;text-align:center}
#cnt .n{font-family:Nunito,sans-serif;font-weight:900;font-size:260px;line-height:1;color:var(--coral);text-shadow:0 10px 0 #fff,0 14px 0 rgba(150,60,40,.18)}
#cnt .u{font-size:84px;margin-top:-10px}
/* carousel-3d (adapted from video-shotcraft carousel-3d) */
#stage{position:absolute;left:0;right:0;top:330px;height:900px;perspective:1500px;perspective-origin:50% 30%}
#ring{position:absolute;left:50%;top:120px;width:0;height:0;transform-style:preserve-3d}
.rc{position:absolute;left:-215px;top:0;width:430px;height:580px;transform-style:preserve-3d}
.rc .face{position:absolute;inset:0;border-radius:40px;background:#fff;padding:16px;box-shadow:0 12px 30px rgba(60,40,20,.25);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.rc .face.bk{transform:rotateY(180deg)}
.rc .ph{width:100%;height:100%;border-radius:28px;background-size:cover;background-position:50% 50%}
.rc .em{position:absolute;left:50%;bottom:-34px;width:84px;height:84px;margin-left:-42px;border-radius:50%;background:var(--cream);font-size:48px;line-height:84px;text-align:center;box-shadow:0 6px 0 rgba(120,80,40,.18)}
.rc .fog{position:absolute;inset:0;border-radius:40px;background:var(--paper);pointer-events:none}
.rc .glow{position:absolute;inset:-10px;border-radius:48px;border:10px solid var(--sun);opacity:0}
#floor{position:absolute;left:50%;top:780px;width:2400px;height:2400px;margin-left:-1200px;border-radius:50%;background:radial-gradient(circle,#f3e2c6 0,#f3e2c6 45%,rgba(243,226,198,0) 70%);transform:rotateX(78deg) translateZ(-470px);opacity:.9}
#cap{position:absolute;left:60px;right:60px;top:1360px;height:360px;overflow:hidden;text-align:center}
#capin{position:absolute;left:0;right:0;top:0}
.cl{height:360px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px}
.cl .no{font-family:Nunito,sans-serif;font-weight:900;font-size:40px;color:var(--coral);letter-spacing:4px}
.cl .nm{font-size:96px;line-height:1.15;margin-top:6px}
.cl .tg{font-size:50px;line-height:1.35;color:#7a6050;margin-top:14px}
#s3h{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:96px}
#s3h b{font-family:Nunito,sans-serif;font-weight:900;font-size:150px;color:var(--coral);vertical-align:-14px;margin-right:12px}
/* select */
.sel{position:absolute;width:470px;height:600px;border-radius:44px;background:#fff;box-shadow:0 12px 0 rgba(120,80,40,.15),0 26px 50px rgba(60,40,20,.25);overflow:hidden}
.sel .ph{position:absolute;left:0;right:0;top:0;height:470px;background-size:165% auto;background-position:50% 52%}
.sel .lb{position:absolute;left:0;right:0;bottom:0;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sel .lb .a{font-size:52px}
.sel .lb .b{font-size:32px;color:#8a7262;margin-top:4px}
.sel .ring{position:absolute;inset:0;border-radius:44px;border:12px solid var(--sun);opacity:0}
.sel .bdg{position:absolute;left:24px;top:24px;width:96px;height:96px;border-radius:50%;color:#fff;font:900 60px/96px Nunito,sans-serif;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.15)}
/* phone frame */
.phone{position:absolute;left:50%;top:50%;width:830px;height:1476px;margin:-738px 0 0 -415px;border-radius:70px;background:#fff;padding:16px;box-shadow:0 16px 0 rgba(120,80,40,.18),0 40px 80px rgba(60,40,20,.32)}
.phone img{width:100%;height:100%;object-fit:cover;border-radius:56px;display:block}
.pop{position:absolute;font-family:Nunito,"Noto Sans TC",sans-serif;font-weight:900;font-size:110px;color:#fff;-webkit-text-stroke:0;text-shadow:0 8px 0 rgba(150,60,40,.35);white-space:nowrap;transform-origin:50% 50%}
/* hp bar */
#hp{position:absolute;left:110px;right:110px;top:300px;height:150px;background:var(--navy);border-radius:36px;padding:22px 30px;box-shadow:0 10px 0 rgba(0,0,0,.18)}
#hp .t{color:#fff;font-size:44px;display:flex;justify-content:space-between}
#hp .bar{margin-top:14px;height:34px;border-radius:20px;background:#1b2447;overflow:hidden}
#hp .bar i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#69db7c,#ffd166)}
/* season chip */
.chip{position:absolute;left:50%;bottom:300px;transform:translateX(-50%);background:var(--cream);border-radius:999px;padding:18px 48px 22px;font-size:70px;box-shadow:0 10px 0 rgba(120,80,40,.18),0 20px 40px rgba(60,40,20,.25);white-space:nowrap}
/* countdown */
.cd{position:absolute;left:0;right:0;top:50%;text-align:center;font-family:Nunito,sans-serif;font-weight:900;font-size:700px;line-height:1;margin-top:-380px;color:#fff;text-shadow:0 22px 0 rgba(150,60,40,.3)}
#logo{position:absolute;left:50%;top:560px;width:300px;height:300px;margin-left:-150px}
#conf{position:absolute;inset:0}
.url{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
</style></head><body>

<!-- S1 open -->
<div class="sc" id="s1"><img class="full" id="s1img">

</div>

<div class="sc" id="s3"><div class="paperbg"></div>

<!-- S6 dojo -->
<div class="sc" id="s6"><div class="paperbg" style="background:linear-gradient(#d9ecf7,#c7e3f2)"></div>

<!-- S7 wardrobe + drink -->
<div class="sc" id="s7"><div class="paperbg" style="background:linear-gradient(#ffeaf0,#ffdbe5)"></div>
  <div class="pill" id="s7t" style="top:70px">換新衣、換一杯 🧋</div>
  <div class="phone" id="s7p" style="top:1010px"><img id="s7img"></div>
</div>
<!-- S8 seasons -->
<div class="sc" id="s8"><img class="full" id="s8img"><img class="full" id="s8img2">
  <div class="pill" id="s8t" style="top:150px">每天上島<b>都不一樣</b></div>

</div>
<!-- SR recap: dataviz-landscape-open adapted (14 tributaries -> one trunk) -->
<div class="sc" id="sr"><canvas id="land" width="1080" height="1920" class="full"></canvas><canvas id="landNear" width="1080" height="1920" class="full" style="filter:blur(10px)"></canvas><canvas id="landLab" width="1080" height="1920" class="full"></canvas>
  <div class="abs" id="srT" style="left:0;right:0;top:150px;text-align:center;color:#fffaf0">
    <div id="srE" style="font-size:52px;color:#ffd166;letter-spacing:6px">14 座小島</div>
    <div id="srL1" style="font-size:110px;line-height:1.2;margin-top:18px;text-shadow:0 6px 30px rgba(0,0,0,.35)">所有的練習，</div>
    <div id="srL2" style="font-size:110px;line-height:1.2;text-shadow:0 6px 30px rgba(0,0,0,.35)">都匯成<span style="color:#ffd166">一座島</span></div>
  </div>
</div>
<!-- S9 outro -->
<div class="sc" id="s9"><img class="full" id="s9bg"><div class="abs" id="s9tint" style="inset:0"></div>
  <div class="cd" id="cdn"></div>
  <div id="end" class="abs" style="inset:0">
    <svg id="logo" viewBox="-3 -3 70 70"><path d="M32 5 54 17.5v25L32 55 24.5 50.7 12.5 58.5l3-12.3L10 42.5v-25z" transform="matrix(1.08 0 0 1.08 -2.56 -2.48)" fill="#fff" stroke="#fff" stroke-width="9.5" stroke-linejoin="round"/><path d="M32 5 54 17.5v25L32 55 24.5 50.7 12.5 58.5l3-12.3L10 42.5v-25z" transform="matrix(1.08 0 0 1.08 -2.56 -2.48)" fill="#ef6a55" stroke="#ef6a55" stroke-width="4.6" stroke-linejoin="round"/><path d="M15 45c4.5-7.5 10.5-11 17-11s12.5 3.5 17 11z" fill="#fffaf0"/><path d="M29.2 35.5h5.6L33.4 19h-2.8z" fill="#fffaf0"/><path d="M29.9 25.5h4.2l.35 3.2h-4.9z" fill="#ef6a55"/><path d="M30.2 19v-2.6a1.8 1.8 0 0 1 3.6 0V19z" fill="#ffd166"/><path d="M36.5 15.5l5-2.4M36.8 18.6l5.4.3" stroke="#ffd166" stroke-width="2" stroke-linecap="round"/><path d="M23.2 50c1.9-1.2 3.7-1.2 5.6 0s3.7 1.2 5.6 0 3.7-1.2 5.6 0" fill="none" stroke="#fffaf0" stroke-width="2" stroke-linecap="round"/></svg>
    <div class="big" id="go" style="top:900px;font-size:190px;color:var(--coral)">上島！</div>
    <div class="url" id="u1" style="top:1150px;font-size:64px">泰瑞島｜UIB 電銷島</div>
    <div class="url" id="u2" style="top:1270px"><span class="tag" style="font-family:Nunito,sans-serif;font-size:58px;padding:16px 46px 20px">terry-island.pages.dev</span></div>
  </div>
  <canvas id="conf" width="1080" height="1920"></canvas>
</div>
<svg id="iris" width="1080" height="1920"><defs><mask id="m"><rect width="1080" height="1920" fill="#fff"/><circle id="irc" cx="540" cy="960" r="0" fill="#000"/></mask></defs><rect id="irr" width="1080" height="1920" fill="#ef6a55" mask="url(#m)" opacity="0"/></svg>

<script>
const FPS=30, CAP='../cap/';
const ISLES=[["h","泰瑞港","⚓","出海前，先笑一下、暖暖身"],["a","DISC島","🦁","先認出客戶是哪一型，再開口"],["j","電銷道場","🥋","跟 AI 客戶對練，練到出師"],["e","感受花園","👂","從「聽到」升級為「聽懂」"],["c","業務心法","💪","每一通，都重新開始"],["f","保單服務站","📮","保單狀態變了，我們先懂"],["d","QA補帖","🛡️","賣對了，才真的有保到"],["g","醫療趨勢島","🏥","把醫療新聞變成好開場"],["p","績效農場","🥕","獎勵怎麼拿、紅線在哪裡"],["w","AI話術湖","📖","成交錄音淬鍊的話術精華"],["b","商品知識","📘","忘了倍數不丟臉，講錯才丟臉"],["k","結束碼","🏷️","下對碼，就是給隊友的地圖"],["x","抓蟲小島","🐞","抓到一隻蟲，全島更正確"],["t","攏好宮","🏮","祝你的客戶，句句攏好講"]];
const S3LEAD=18, S3STEP=18, S3HOLD=12; // per-island: 12f hold + 6f turn
const PETS=[["D・雷歐","講重點、給數字","#e2735b"],["I・小藍","愛聊天、重感覺","#f0b429"],["S・抱抱","慢熱、要安心","#4caf72"],["C・博士","問細節、要證據","#8e6bd1"]];
const SEAS=[["sea_spring","🌸 春天"],["sea_summer","🌻 夏天"],["sea_autumn","🍁 秋天"],["sea_winter","⛄ 冬天"],["fest_xmas","🎄 聖誕節"],["fest_moon","🥮 中秋節"],["fest_newyear","🎆 跨年"],["fest_lantern","🏮 元宵節"]];
// timeline [id,start,end]
const TL=[["s1",0,120],["s2",120,240],["s3",240,510],["s4",510,690],["s5",690,900],["s6",900,1080],["s7",1080,1260],["s8",1260,1410],["sr",1410,1590],["s9",1590,1770]];
const TOTAL=1770;
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(f,a,b)=>cl((f-a)/(b-a));
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo=t=>1-Math.pow(1-t,3);
const back=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const spring=t=>t<=0?0:t>=1?1:1-Math.exp(-6*t)*Math.cos(10*t);
const pad=n=>String(n).padStart(4,'0');
function popIn(el,f,a,dur=14,base=''){const t=lin(f,a,a+dur);const s=spring(t);el.style.opacity=t>0?Math.min(1,t*3):0;el.style.transform=base+` scale(${(.3+.7*s).toFixed(4)})`;}
function popOut(el,f,a,dur=8,base=''){if(f<a)return;const t=lin(f,a,a+dur);el.style.opacity=1-t;el.style.transform=base+` scale(${1+.15*t})`;}
// build carousel ring: 14 cards, double-faced so nothing ever reads mirrored
const ring=$('ring'),NR=ISLES.length,RAD=1050,AST=360/NR;
ISLES.forEach(([id,n,e],i)=>{const d=document.createElement('div');d.className='rc';const face=`<div class="ph" style="background-image:url(${CAP}isles/isle_${id}.jpg)"></div><div class="em">${e}</div><div class="fog"></div><div class="glow"></div>`;d.innerHTML=`<div class="face">${face}</div><div class="face bk">${face}</div>`;ring.appendChild(d)});
const capin=$('capin');ISLES.forEach(([id,n,e,tg],i)=>{const d=document.createElement('div');d.className='cl';d.innerHTML=`<div class="no">${String(i+1).padStart(2,'0')} / 14</div><div class="nm">${e} ${n}</div><div class="tg">${tg}</div>`;capin.appendChild(d)});
const sels=$('sels');
PETS.forEach(([n,b,c],i)=>{const d=document.createElement('div');d.className='sel';d.style.left=(60+(i%2)*490)+'px';d.style.top=(470+(i>>1)*650)+'px';d.innerHTML=`<div class="ph" style="background-image:url(${CAP}pets/pet${i}.jpg)"></div><div class="lb"><div class="a">${n}</div><div class="b">${b}</div></div><div class="bdg" style="background:${c}">${'DISC'[i]}</div><div class="ring"></div>`;sels.appendChild(d)});
$('s4bg').src=CAP+'pets/disc_isle.jpg';$('s9bg').src=CAP+'isles/wide.jpg';
// confetti (deterministic)
const CF=[];let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
for(let i=0;i<140;i++)CF.push({x:540+(rnd()-.5)*300,y:1000,vx:(rnd()-.5)*34,vy:-rnd()*42-14,r:rnd()*6,vr:(rnd()-.5)*.4,c:["#ff8fab","#ffd166","#8ecae6","#c77dff","#69db7c","#ffa94d","#ef6a55"][i%7],s:14+rnd()*14});
function confetti(t){const cx=$('conf').getContext('2d');cx.clearRect(0,0,1080,1920);if(t<0)return;for(const p of CF){const x=p.x+p.vx*t,y=p.y+p.vy*t+1.1*t*t*.5,r=p.r+p.vr*t;cx.save();cx.translate(x,y);cx.rotate(r);cx.fillStyle=p.c;cx.globalAlpha=cl(1-(t-40)/30);cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);cx.restore()}}
function setImg(id,src){const el=$(id);if(el.getAttribute('src')!==src)el.setAttribute('src',src);return el}
function iris(f){ // closing/opening circle between scenes, coral
  const r=$('irr'),c=$('irc');let v=-1;
  for(const [id,a,b] of TL){ if(a===0)continue; const d=f-a; if(d>=-8&&d<0)v=lin(d,-8,0); else if(d>=0&&d<8)v=1-lin(d,0,8); }
  if(v<0){r.setAttribute('opacity',0);return}
  r.setAttribute('opacity',1);c.setAttribute('r',(1-eio(v))*1150);
}
// ---------- recap landscape ----------
const LF=1000, CAMH=560, HOR=560, CX=540;
const trunkX=Z=>140*Math.sin(Z/1100)+0.16*Z;  // drifts right so the vanishing point sits in the right third
function bez(p0,p1,p2,p3,t){const u=1-t;return [u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]}
const TRUNK=[];for(let k=0;k<=160;k++){const Z=-100+k*25;TRUNK.push([trunkX(Z),Z])}
const TRIB=ISLES.map((is,i)=>{const Zj=380+i*200,s=(i%2?1:-1),J=[trunkX(Zj),Zj],J0=[trunkX(Zj-40),Zj-40];const tx=J[0]-J0[0],tz=J[1]-J0[1],tl=Math.hypot(tx,tz);
  const P3=J,P2=[J[0]-tx/tl*260+s*40,J[1]-tz/tl*260],P0=[J[0]+s*(560+(i%3)*150),Zj-480-(i%4)*60],P1=[P0[0]-s*120,P0[1]+260];
  const pts=[];for(let k=0;k<=60;k++)pts.push(bez(P0,P1,P2,P3,k/60));return {pts,lab:bez(P0,P1,P2,P3,.6),is,i}});
function proj(X,Z,camX,camZ,Y=0){const z=Z-camZ;if(z<40)return null;return [CX+LF*(X-camX)/z, HOR+1.55*LF*(CAMH-Y)/z, z]}
function drawLine(cxF,cxN,pts,upto,camX,camZ,w,col,f){for(let k=1;k<pts.length;k++){if(k/(pts.length-1)>upto)break;const a=proj(pts[k-1][0],pts[k-1][1],camX,camZ),b=proj(pts[k][0],pts[k][1],camX,camZ);if(!a||!b)continue;
