<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&family=Press+Start+2P&display=block">
<style>html,body{margin:0;background:#000;width:1080px;height:1920px;overflow:hidden}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,SW=1080,SH=759,SY=560,LW=360,LH=253,K=3;
const FR='/home/user/QA-/promo/pixel/frames/';
const c=document.getElementById('c'),x=c.getContext('2d');
const buf=document.createElement('canvas');buf.width=LW;buf.height=LH;const bx=buf.getContext('2d');
const tiny=document.createElement('canvas');const tx=tiny.getContext('2d');
let TL,IM={},LOGO,PORT;
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lin=(f,a,b)=>cl((f-a)/(b-a)),eio=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,eo=t=>1-Math.pow(1-t,3);
function load(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src})}
// ---- pixel text: render small, threshold alpha, upscale nearest
const tcache={};
function ptxt(s,{size=14,scale=4,color='#fff',stroke='#000',font='"Noto Sans TC"',weight=900,olw=1}={}){
 const key=[s,size,scale,color,stroke,font].join('|');if(tcache[key])return tcache[key];
 const o=document.createElement('canvas'),q=o.getContext('2d');q.font=`${weight} ${size}px ${font}`;
 const w=Math.ceil(q.measureText(s).width)+olw*2+4,h=Math.ceil(size*1.35)+olw*2+2;o.width=w;o.height=h;
 q.font=`${weight} ${size}px ${font}`;q.textBaseline='middle';
 const draw=(col,dx,dy)=>{q.fillStyle=col;q.fillText(s,olw+2+dx,h/2+dy)};
 if(stroke)for(let dx=-olw;dx<=olw;dx++)for(let dy=-olw;dy<=olw;dy++)if(dx||dy)draw(stroke,dx,dy);
 draw(color,0,0);
 const d=q.getImageData(0,0,w,h),a=d.data;for(let i=3;i<a.length;i+=4)a[i]=a[i]>110?255:0;q.putImageData(d,0,0);
 return tcache[key]={o,w:w*scale,h:h*scale};
}
function drawT(s,cx,cy,opt={},alpha=1,sc=1){const t=ptxt(s,opt);x.save();x.globalAlpha=alpha;x.imageSmoothingEnabled=false;const w=t.w*sc,h=t.h*sc;x.drawImage(t.o,Math.round(cx-w/2),Math.round(cy-h/2),Math.round(w),Math.round(h));x.restore();}
function typed(s,l,speed=1.3){return [...s].slice(0,Math.floor(l*speed)).join('')}
// ---- deterministic rng
let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const CONF=[];for(let i=0;i<90;i++)CONF.push({x:rnd(),vx:(rnd()-.5)*10,vy:-rnd()*22-8,c:['#ffd166','#ef6a55','#69db7c','#8ecae6','#ff8fab','#c77dff'][i%6],s:2+Math.floor(rnd()*2)});
function confetti(t,ox,oy,ww){for(const p of CONF){const X=ox+p.x*ww+p.vx*t,Y=oy+p.vy*t+.9*t*t;if(Y>oy+SH+40)continue;x.fillStyle=p.c;x.fillRect(Math.round(X/6)*6,Math.round(Y/6)*6,p.s*6,p.s*6)}}
// ---- scene renderer into buf
function sceneBuf(img,cam,u){const z=cam[0]+(cam[1]-cam[0])*eio(u),cx=cam[2]+(cam[3]-cam[2])*eio(u),cy=cam[4]+(cam[5]-cam[4])*eio(u);
 const sw=img.width/z,sh=img.height/z;let sx=cx*img.width-sw/2,sy=cy*img.height-sh/2;sx=cl(sx,0,img.width-sw);sy=cl(sy,0,img.height-sh);
 bx.imageSmoothingEnabled=true;bx.imageSmoothingQuality='high';bx.drawImage(img,sx,sy,sw,sh,0,0,LW,LH);}
function blit(px,ox,oy){ // px: pixelation factor (1=none)
 x.imageSmoothingEnabled=false;
 if(px<=1){x.drawImage(buf,ox,oy,SW,SH);return}
 const w=Math.max(4,Math.round(LW/px)),h=Math.max(3,Math.round(LH/px));tiny.width=w;tiny.height=h;tx.imageSmoothingEnabled=true;tx.drawImage(buf,0,0,w,h);x.drawImage(tiny,ox,oy,SW,SH);}
function bar(X,Y,w,v,col,flip){x.fillStyle='#fff';x.fillRect(X-6,Y-6,w+12,36);x.fillStyle='#3a1020';x.fillRect(X,Y,w,24);const vw=Math.round(w*v/100/6)*6;x.fillStyle=col;x.fillRect(flip?X+w-vw:X,Y,vw,24);x.fillStyle='rgba(255,255,255,.35)';x.fillRect(flip?X+w-vw:X,Y,vw,6);}
function scanlines(){x.fillStyle='rgba(0,0,0,.18)';for(let y=SY;y<SY+SH;y+=6)x.fillRect(0,y,W,2)}
function header(){drawT('TERRY ISLAND',540,170,{size:8,scale:5,font:'"Press Start 2P"',weight:400,color:'#ffd166'},0.9);drawT('泰瑞島',540,250,{size:12,scale:4,color:'#fff'},0.9)}
// ---- main
window.render=function(f){
 x.fillStyle='#000';x.fillRect(0,0,W,H);
 let s0=0,S=null,l=0,idx=0;for(let i=0;i<TL.length;i++){if(f<s0+TL[i].dur){S=TL[i];l=f-s0;idx=i;break}s0+=TL[i].dur}
 if(!S){S=TL[TL.length-1];l=S.dur-1}
 if(S.end==='count'){const g=IM['S16_group'];const k=Math.min(2,Math.floor(l/24)),lt=l-k*24;const cols=['#ef6a55','#ffd166','#69db7c'];
   sceneBuf(g,[1.0,1.08,.5,.5,.5,.48],l/(S.dur-1));
   const jump=lt<10?Math.round(Math.sin(Math.PI*lt/10)*8)*3:0;blit(1,0,SY-jump);
   if(lt<5){x.fillStyle=`rgba(255,255,255,${0.35*(1-lt/5)})`;x.fillRect(0,SY,W,SH)}
   scanlines();
   drawT('準備好了嗎？',540,470,{size:14,scale:5,color:'#ffd166'});
   const dy=-260*(1-eo(cl(lt/6)));const sq=lt>=6&&lt<10?1+0.12*Math.sin(Math.PI*(lt-6)/4):1;
   drawT(String(3-k),540,SY+SH/2+dy,{size:16,scale:22,font:'"Press Start 2P"',weight:400,color:cols[k],stroke:'#000',olw:2},1,sq);
   if(lt>=6&&lt<16){x.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<8;i++){const a=i*Math.PI/4,r=180+(lt-6)*28;x.fillRect(Math.round((540+Math.cos(a)*r)/6)*6,Math.round((SY+SH/2+Math.sin(a)*r*0.6)/6)*6,18,18)}}
   const s2=typed('出發！',Math.max(0,l-50),0.3);if(s2&&k===2)drawT(s2,540,1450,{size:16,scale:5,color:'#fff'});
   header();return}
 if(S.end==='card'){const g=IM['S16_group'];sceneBuf(g,[1.08,1.14,.5,.5,.48,.46],l/(S.dur-1));const jump=l<12?Math.round(Math.sin(Math.PI*l/12)*14)*3:0;blit(1,0,SY-jump);if(l<8){x.fillStyle=`rgba(255,255,255,${1-l/8})`;x.fillRect(0,SY,W,SH)}x.fillStyle=`rgba(0,0,0,${.45*eo(lin(l,4,20))})`;x.fillRect(0,SY,W,SH);scanlines();
   const s=eo(lin(l,4,18));x.save();x.translate(540,SY+270);x.scale(s,s);x.drawImage(LOGO,-150,-150,300,300);x.restore();
   drawT('上島！',540,SY+560,{size:26,scale:6,color:'#ffd166'},lin(l,10,16),.7+.3*eo(lin(l,10,20)));
   drawT('泰瑞島｜UIB 電銷島',540,1430,{size:14,scale:4},lin(l,20,28));
   drawT('terry-island.pages.dev',540,1550,{size:9,scale:5,font:'"Press Start 2P"',weight:400,color:'#8ecae6'},lin(l,28,36));
   if(Math.floor(l/15)%2===0&&l>40)drawT('PRESS START',540,1700,{size:8,scale:5,font:'"Press Start 2P"',weight:400,color:'#fff'});
   confetti(Math.max(0,l-12),0,SY+150,W);header();return}
 const img=IM[S.img],u=l/(S.dur-1);sceneBuf(img,S.cam,u);
 // shake
 let ox=0,oy=SY;for(const e of S.fx){if(e.t==='shake'&&l>=e.at&&l<e.at+e.len){ox+=((l%2)?1:-1)*e.amp*3}
   if(e.t==='hit'&&l>=e.at&&l<e.at+8){const a=(8-(l-e.at))*3;ox+=((l%2)?1:-1)*a;oy+=((l%3)-1)*a*.6}}
 // pixel transition in/out
 const pin=1+11*(1-eo(lin(l,0,7))),pout=S.noOut?1:1+11*eo(lin(l,S.dur-6,S.dur));const px=Math.max(pin,pout);
 blit(px,Math.round(ox/3)*3,Math.round((oy-SY)/3)*3+SY);
 // overlays inside scene
 for(const e of S.fx){const t=l-(e.at||0);
  if(e.t==='flash'&&t>=0&&t<6){x.fillStyle=`rgba(255,255,255,${1-t/6})`;x.fillRect(0,SY,W,SH)}
  if(e.t==='big'&&t>=0&&t<e.len){const sc=t<6?0.5+0.5*eo(t/6):1;const fl=t>e.len-6?(e.len-t)/6:1;drawT(e.txt,540,SY+SH/2,{size:16,scale:7,font:'"Press Start 2P"',weight:400,color:e.c,stroke:'#000',olw:2},fl,sc)}
  if(e.t==='tag'&&t>=0){const sc=0.4+0.6*eo(cl(t/6));drawT(e.txt,e.x*W,SY+e.y*SH+18,{size:12,scale:6,font:'"Press Start 2P"',weight:400,color:'#fff',stroke:e.c,olw:2},1,sc)}
  if(e.t==='pop'&&t>=0&&t<30){drawT(e.txt,e.x*W,SY+e.y*SH-t*3,{size:12,scale:5,font:e.txt.match(/[A-Z+0-9]/)?'"Press Start 2P"':'"Noto Sans TC"',weight:e.txt.match(/[A-Z+0-9]/)?400:900,color:e.c,stroke:'#000',olw:2},t>22?(30-t)/8:1,0.6+0.4*eo(cl(t/5)))}
  if(e.t==='combo'&&t>=0){const n=t<14?1:t<28?2:3;drawT('COMBO x'+n,540,SY+110,{size:14,scale:5,font:'"Press Start 2P"',weight:400,color:['#ffd166','#ff8fab','#69db7c'][n-1],stroke:'#000',olw:2},1,1+.25*Math.max(0,1-((t%14)/5)))}
  if(e.t==='confetti'&&t>=0)confetti(t,0,SY+SH*.5,W);
 }
 scanlines();
 // HUD above scene
 const huds=S.fx.filter(e=>e.t==='hud');if(huds.length){let a=huds[0].a[0],b=huds[0].b[0];for(const h of huds){const tt=h.len?eio(lin(l,h.at,h.at+h.len)):1;if(!h.len||l>=h.at){a=h.a[0]+(h.a[1]-h.a[0])*tt;b=h.b[0]+(h.b[1]-h.b[0])*tt}}
  bar(60,420,400,a,'#ffd166',false);bar(620,420,400,b,'#ef6a55',true);drawT('小狗新人',150,495,{size:10,scale:4});drawT('客戶魔王',930,495,{size:10,scale:4});drawT('VS',540,432,{size:10,scale:5,font:'"Press Start 2P"',weight:400,color:'#fff'})}
 else if(S.top){drawT(S.top,540,470,{size:14,scale:5,color:'#ffd166',font:/^[A-Z0-9 !]+$/.test(S.top)?'"Press Start 2P"':'"Noto Sans TC"',weight:/^[A-Z0-9 !]+$/.test(S.top)?400:900},lin(l,2,8))}
 // subtitle / dialogue below
 if(S.sub){const s=typed(S.sub,Math.max(0,l-6),0.9);if(s){const full=ptxt(S.sub,{size:16,scale:5,color:'#fff'});drawT(s,540,1450,{size:16,scale:5,color:'#fff'},1,Math.min(1,1010/full.w))}}
 if(S.dlg){const by=1360,bh=300;x.fillStyle='#fff';x.fillRect(54,by-6,972,bh+12);x.fillStyle='#14204a';x.fillRect(60,by,960,bh);
  x.imageSmoothingEnabled=false;x.drawImage(PORT,84,by+24,252,252);
  drawT('島主 泰瑞',560,by+60,{size:10,scale:4,color:'#ffd166'});const s=typed(S.dlg,Math.max(0,l-8),0.6);if(s)drawT(s,680,by+160,{size:12,scale:4,color:'#fff'});
  if(Math.floor(l/10)%2===0&&l>40)drawT('▼',960,by+250,{size:8,scale:4,color:'#fff'})}
 header();
};
window.ready=(async()=>{TL=window.TLDATA;await document.fonts.load('900 14px "Noto Sans TC"','泰瑞島');await document.fonts.load('16px "Press Start 2P"');await document.fonts.ready;
 for(const s of TL)if(s.img&&!IM[s.img])IM[s.img]=await load(FR+s.img+'.png');IM['S16_group']=IM['S16_group']||await load(FR+'S16_group.png');
 PORT=await load(FR+'ref_terry_portrait_v2.png');
 LOGO=await load('data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 70 70"><path d="M32 5 54 17.5v25L32 55 24.5 50.7 12.5 58.5l3-12.3L10 42.5v-25z" transform="matrix(1.08 0 0 1.08 -2.56 -2.48)" fill="#fff" stroke="#fff" stroke-width="9.5" stroke-linejoin="round"/><path d="M32 5 54 17.5v25L32 55 24.5 50.7 12.5 58.5l3-12.3L10 42.5v-25z" transform="matrix(1.08 0 0 1.08 -2.56 -2.48)" fill="#ef6a55" stroke="#ef6a55" stroke-width="4.6" stroke-linejoin="round"/><path d="M15 45c4.5-7.5 10.5-11 17-11s12.5 3.5 17 11z" fill="#fffaf0"/><path d="M29.2 35.5h5.6L33.4 19h-2.8z" fill="#fffaf0"/><path d="M29.9 25.5h4.2l.35 3.2h-4.9z" fill="#ef6a55"/><path d="M30.2 19v-2.6a1.8 1.8 0 0 1 3.6 0V19z" fill="#ffd166"/><path d="M23.2 50c1.9-1.2 3.7-1.2 5.6 0s3.7 1.2 5.6 0 3.7-1.2 5.6 0" fill="none" stroke="#fffaf0" stroke-width="2" stroke-linecap="round"/></svg>`));
 return TL.reduce((a,s)=>a+s.dur,0);})();
</script></body></html>
